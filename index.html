<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Årshjul og Skolekalender</title>
    <link rel="icon" type="image/png" href="aarshjul.svg">
    <link rel="apple-touch-icon" href="aarshjul.svg">

  <!-- FullCalendar CDN -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/locales/no.global.min.js"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Egen CSS-fil -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="app-layout">
    <!-- Sidepanel -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>Skolekalender</h2>
      </div>

      <!-- Mini-kalender -->
      <div class="mini-calendar">
        <div class="mini-cal-header">
          <button id="miniPrevBtn" type="button">&lt;</button>
          <span id="miniCalTitle"></span>
          <button id="miniNextBtn" type="button">&gt;</button>
        </div>
        <div id="miniCalGrid" class="mini-cal-grid"></div>
      </div>

      <!-- Kategorifilter -->
      <div class="filter-section">
        <div class="filter-header">
          <h3>Kategorier</h3>
          <button id="btnToggleAllCategories" type="button" class="btn-text">Velg ingen</button>
        </div>
        <div id="filterList" class="filter-list"></div>
      </div>
    </aside>

    <!-- Hovedinnhold med FullCalendar -->
    <main class="main-content">
      <div id="calendar"></div>
    </main>
  </div>

  <!-- Hurtigmeny-popover ved markering -->
  <div id="selectionPopover" class="popover">
    <button id="btnQuickNewEvent" type="button" class="btn btn-primary btn-sm">+ Ny avtale</button>
    <button id="btnQuickNewRecurring" type="button" class="btn btn-secondary btn-sm">🔁 Regelmessig</button>
  </div>

  <!-- Høyreklikk-kontekstmeny -->
  <div id="contextMenu" class="context-menu">
    <div id="menuNewEvent" class="context-menu-item">➕ Ny avtale</div>
    <div id="menuNewRecurringEvent" class="context-menu-item">🔁 Ny regelmessig avtale</div>
  </div>

  <!-- Modal for Visning / Opprettelse / Redigering -->
  <div id="eventModal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modalHeaderTitle">Ny avtale</h3>
        <button id="modalCloseX" type="button" class="close-btn">&times;</button>
      </div>

      <!-- VISNINGSMODUS -->
      <div id="viewMode" class="modal-body" style="display: none;">
        <h2 id="viewTitle" class="view-title"></h2>
        <div class="view-badge"><span id="viewGroup"></span></div>
        <p class="view-detail"><strong>Tid:</strong> <span id="viewTime"></span></p>
        <p id="viewRecurringRow" class="view-detail" style="display: none;">
          <strong>Gjentakelse:</strong> <span id="viewRecurring"></span>
        </p>
        <p class="view-detail"><strong>Beskrivelse:</strong></p>
        <div id="viewDescription" class="view-description-box"></div>
      </div>

      <!-- SKJEMAMODUS (Opprett / Rediger) -->
      <form id="eventForm" class="modal-body">
        <input type="hidden" id="eventId" />
        <input type="hidden" id="isRecurringMode" value="false" />

        <div class="form-group">
          <label for="title">Tittel</label>
          <input type="text" id="title" required placeholder="Tittel på avtalen..." />
        </div>

        <div class="form-group">
          <label for="group">Kategori</label>
          <select id="group" required></select>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="startDate">Startdato</label>
            <input type="date" id="startDate" required />
          </div>
          <div class="form-group">
            <label for="startTime">Starttid</label>
            <input type="time" id="startTime" />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="endDate">Sluttdato</label>
            <input type="date" id="endDate" />
          </div>
          <div class="form-group">
            <label for="endTime">Sluttid</label>
            <input type="time" id="endTime" />
          </div>
        </div>

        <div id="recurringGroup" class="form-group" style="display: none;">
          <label for="repeatPattern">Gjenta</label>
          <select id="repeatPattern">
            <option value="weekly">Hver uke</option>
            <option value="biweekly">Annenhver uke</option>
            <option value="monthly">Hver måned</option>
          </select>
        </div>

        <div class="form-group">
          <label for="description">Beskrivelse</label>
          <textarea id="description" rows="3" placeholder="Valgfri beskrivelse..."></textarea>
        </div>
      </form>

      <!-- BEKREFT SLETTING AV SERIE -->
      <div id="deleteConfirmMode" class="modal-body" style="display: none;">
        <p>Denne hendelsen er en del av en regelmessig serie. Hva vil du slette?</p>
        <div class="delete-options">
          <button id="deleteSingleBtn" type="button" class="btn btn-danger">Kun denne hendelsen</button>
          <button id="deleteFutureBtn" type="button" class="btn btn-danger">Denne og fremtidige</button>
          <button id="deleteAllSeriesBtn" type="button" class="btn btn-danger">Hele serien</button>
          <button id="cancelDeleteModeBtn" type="button" class="btn btn-secondary">Avbryt</button>
        </div>
      </div>

      <!-- FOOTER KNAPPER -->
      <div id="normalFooter" class="modal-footer">
        <button id="formCancelBtn" type="button" class="btn btn-secondary">Avbryt</button>
        <button id="viewCancelBtn" type="button" class="btn btn-secondary" style="display: none;">Lukk</button>
        <button id="viewEditBtn" type="button" class="btn btn-primary" style="display: none;">Rediger</button>
        <button id="viewDeleteBtn" type="button" class="btn btn-danger" style="display: none;">Slett</button>
        <button id="formSubmitBtn" type="submit" form="eventForm" class="btn btn-primary">Lagre</button>
      </div>

    </div>
  </div>

  <!-- Hovedskript som ES-modul -->
  <script type="module" src="app.js"></script>
</body>
</html>
